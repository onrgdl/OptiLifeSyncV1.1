<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OptiLifeSync</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #080f1e;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .logo-box {
            width: 84px;
            height: 84px;
            border-radius: 22px;
            background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.35);
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
        .sub { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }
        .status-box {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-text { font-size: 14px; font-weight: 600; color: #38bdf8; }
        .error-section { display: none; margin-top: 16px; text-align: left; }
        .error-msg { font-size: 13px; color: #f87171; margin-bottom: 14px; line-height: 1.4; }
        .form-input {
            width: 100%;
            background: #080f1e;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 12px;
            outline: none;
        }
        .form-input:focus { border-color: #38bdf8; }
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
            font-weight: 700;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
        .tips {
            font-size: 11px;
            color: #64748b;
            margin-top: 12px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <img src="assets/icons/icon-192.png" alt="OptiLifeSync" style="width:72px;height:72px;border-radius:18px;object-fit:cover;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,0.3);">
    <h1>OptiLifeSync</h1>
    <div class="sub">KİŞİSEL SAĞLIK TAKİP SİSTEMİ</div>

    <div class="status-box">
        <div id="loader">
            <div class="spinner"></div>
            <div class="status-text" id="statusText">Sunucuya bağlanılıyor…</div>
        </div>

        <div class="error-section" id="errorSection">
            <div class="error-msg" id="errorMsg">
                ⚠️ Sunucuya ulaşılamadı. Telefon ve bilgisayarınızın aynı Wi-Fi ağında olduğundan emin olun.
            </div>

            <label style="font-size: 11px; color:#94a3b8; font-weight:600; display:block; margin-bottom:4px;">Sunucu Adresi (IP):</label>
            <input type="text" class="form-input" id="serverUrlInput" value="http://10.10.18.50/Gyp/dashboard.php">
            
            <button class="btn-action" onclick="retryConnection()">Yeniden Bağlan</button>

            <div class="tips">
                💡 <strong>İpucu:</strong> Bilgisayarınızda <code>firewall_unblock.bat</code> dosyasını yönetici olarak çalıştırıp güvenlik duvarı iznini açtığınızdan emin olun.
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_URL = 'http://10.10.18.50/Gyp/dashboard.php';
        let targetUrl = localStorage.getItem('optilifesync_server_url') || DEFAULT_URL;
        document.getElementById('serverUrlInput').value = targetUrl;

        async function checkAndRedirect() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('errorSection').style.display = 'none';
            document.getElementById('statusText').textContent = 'Sunucu yanıtı kontrol ediliyor…';

            try {
                // Sunucuyu test et (timeout 4 saniye)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                // Ping için api/ping.php çağrılır (kimlik doğrulaması gerektirmez)
                const pingUrl = targetUrl.replace(/dashboard\.php(\?.*)?$/i, 'api/ping.php');
                const response = await fetch(pingUrl, {
                    method: 'GET',
                    signal: controller.signal,
                    cache: 'no-cache'
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    document.getElementById('statusText').textContent = 'Bağlantı kuruldu! Yönlendiriliyorsunuz…';
                    localStorage.setItem('optilifesync_server_url', targetUrl);
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 400);
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (err) {
                console.warn('Bağlantı başarısız:', err);
                const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
                document.getElementById('loader').style.display = 'none';
                document.getElementById('errorSection').style.display = 'block';
                document.getElementById('errorMsg').innerHTML = `
                    <strong>⚠️ Bağlantı Kurulamadı!</strong><br>
                    <code>${esc(targetUrl)}</code> adresinden yanıt alınamadı.<br>
                    <span style="font-size:11px;color:#94a3b8">${err.name === 'AbortError' ? 'Zaman aşımı (Firewall engeli veya IP değişmiş olabilir)' : esc(err.message)}</span>
                `;
            }
        }

        function retryConnection() {
            const inputVal = document.getElementById('serverUrlInput').value.trim();
            if (inputVal) {
                targetUrl = inputVal;
                checkAndRedirect();
            }
        }

        // Başlangıçta kontrol et
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(checkAndRedirect, 500);
        });
    </script>
</body>
</html>
