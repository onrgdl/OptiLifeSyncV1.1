# OptiLifeSync — Supabase / Vercel "uyku" önleyici
# İki günde bir siteye + veritabanına hafif bir istek atar; ücretsiz Supabase
# projesinin hareketsizlik nedeniyle duraklatılmasını engeller.
# Elle çalıştırmak için: GitHub → Actions → "Keep alive" → "Run workflow".

name: Keep alive

on:
  schedule:
    - cron: '17 5 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Siteyi ve veritabanını yokla
        run: |
          set -euo pipefail
          URL="https://opti-life-sync-v1-1.vercel.app/api/ping.php?db=1"
          RESP="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 "$URL")"
          echo "Yanıt: $RESP"
          # Veritabanı gerçekten yanıt vermiş olmalı ("db":true)
          if ! echo "$RESP" | tr -d ' ' | grep -q '"db":true'; then
            echo "::error::Yanıtta \"db\":true yok; veritabanına ulaşılamadı."
            exit 1
          fi
