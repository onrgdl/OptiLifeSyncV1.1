# OptiLifeSync — Android APK'yı GitHub sunucularında otomatik derler.
# Bilgisayarınıza Node.js / Android Studio kurmanız GEREKMEZ.
#
# Ne zaman çalışır?
#   • capacitor-app/ klasöründe bir değişiklik GitHub'a yüklendiğinde
#   • veya GitHub → Actions → "Android APK" → "Run workflow" butonuyla elle
#
# APK nereden indirilir?
#   • GitHub → Releases → "OptiLifeSync Android (son sürüm)" → OptiLifeSync.apk
#   • veya Actions → ilgili çalışma → Artifacts → OptiLifeSync-apk

name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'capacitor-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor-app

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor bağımlılıklarını kur
        # package-lock.json varsa birebir sürümler kurulur (tekrarlanabilir derleme)
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::capacitor-app/package-lock.json bulunamadı; npm install kullanılıyor. Kilit dosyasını depoya ekleyin."
            npm install --no-audit --no-fund
          fi

      - name: Android projesini oluştur
        run: |
          rm -rf android
          npx cap add android

      - name: Yerel alarm kodunu ve ikonları ekle
        run: |
          APP=android/app/src/main
          cp native/AndroidManifest.xml "$APP/AndroidManifest.xml"
          mkdir -p "$APP/java/com/optilifesync/app"
          cp native/java/com/optilifesync/app/*.java "$APP/java/com/optilifesync/app/"
          cp -r native/res/* "$APP/res/"
          # Uyarlanabilir (adaptive) varsayılan Capacitor ikonlarını kaldır; kendi ikonumuz kullanılsın
          rm -f "$APP/res/mipmap-anydpi-v26/ic_launcher.xml" "$APP/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          rm -f "$APP"/res/mipmap-*/ic_launcher_foreground.png
          # Sürüm numarası: her derlemede artar (telefona güncelleme olarak kurulabilir).
          # Sabit +1000 ofseti: workflow yeniden oluşturulup run_number sıfırlansa bile
          # telefonda kurulu olan sürüm kodunun altına düşülmez.
          sed -i -E "s/versionCode [0-9]+/versionCode $(( ${{ github.run_number }} + 1000 ))/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Capacitor senkronizasyonu
        run: npx cap sync android

      - name: İmza anahtarı (her sürüm aynı anahtarla imzalanır → üstüne güncellenebilir)
        run: |
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: capacitor-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı hazırla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OptiLifeSync.apk

      - name: Özel imza anahtarı tanımlı mı?
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "private=true" >> "$GITHUB_OUTPUT"
            echo "Özel (private) imza anahtarı kullanılacak."
          else
            echo "private=false" >> "$GITHUB_OUTPUT"
            echo "Özel imza sırları tanımlı değil; depodaki debug.keystore ile imzalı APK kullanılacak."
          fi

      - name: APK'yı özel anahtarla imzala (isteğe bağlı)
        if: steps.signing.outputs.private == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -n 1)"
          echo "build-tools: $BT"
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KS_B64" | base64 -d > "$KS"
          # Önce zipalign, sonra apksigner (sıra önemlidir)
          "$BT/zipalign" -p -f 4 OptiLifeSync.apk aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS" --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out OptiLifeSync-signed.apk aligned.apk
          "$BT/apksigner" verify --print-certs OptiLifeSync-signed.apk
          mv -f OptiLifeSync-signed.apk OptiLifeSync.apk
          rm -f aligned.apk "$KS"

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: OptiLifeSync-apk
          path: capacitor-app/OptiLifeSync.apk
          retention-days: 30

      - name: Releases sayfasında yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Derleme #${{ github.run_number }} (${GITHUB_SHA::7}) — telefona indirip kurun. Güncellerken eski sürümü silmenize gerek yok."
          # Sürüm SİLİNMEZ: yoksa oluşturulur, varsa dosyası değiştirilir (indirme bağlantısı hiç kopmaz)
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest \
              --title "OptiLifeSync Android (son sürüm)" \
              --notes "$NOTES" \
              --target "${{ github.sha }}" \
              --latest
          gh release upload apk-latest OptiLifeSync.apk --clobber
          # Notu güncelle; --target desteklenmiyorsa yalnızca notu güncelle
          gh release edit apk-latest --title "OptiLifeSync Android (son sürüm)" --notes "$NOTES" --target "${{ github.sha }}" \
            || gh release edit apk-latest --notes "$NOTES"
          # Etiketi (tag) yeni commit'e taşı; sürüm silinmeden yapılır. Başarısız olursa yayın yine geçerlidir.
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/apk-latest" \
            -f sha="${{ github.sha }}" -F force=true >/dev/null \
            || echo "::warning::apk-latest etiketi taşınamadı (APK yine de yüklendi)."
